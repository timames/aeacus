# =============================================================================
# HBA CyberEagles Bootcamp - Day 3 Part 1 - Windows Server 2022
# aeacus v2.1.1 scoring config. This file (answer key) is mirrored in the
# public fork at timames/aeacus under images/ — a deliberate choice.
#
# Lines marked PLANT: are the vulns you must create on the image before
# running `aeacus --verbose release`. Fix-test on a clone to 100 first.
#
# README should say: DNS is a required service; IIS is NOT required;
# no media files or hacking tools are authorized.
#
# Total: 100 pts across 20 checks, plus 2 penalties.
# =============================================================================

name = 'hba-day3-winserver'
title = 'HBA CyberEagles Bootcamp Day 3'
os = 'Windows Server 2022'
user = 'Administrator'
local = true
version = '2.1.1'

# Remote scoreboard (Cloudflare Worker). Payload is plain hex (no encryption);
# vuln details are still encrypted by aeacus, server only records the score.
# Teams must set their ID in C:\aeacus\TeamID.txt (e.g. eagles01).
remote = 'https://hba-scoreboard.tim-ames.workers.dev'
DisableRemoteEncryption = true

# ------------------------------------------------------------------ forensics
# PLANT: Create "Forensics Question 1.txt" on Administrator's Desktop:
#   An unauthorized web server is running on this machine. What TCP port
#   does it listen on?  ANSWER:
# (Answer matches the IIS default port 80, planted below.)
[[check]]
message = 'Forensics Question 1 correct'
points = 8
    [[check.pass]]
    type = 'FileContainsRegex'
    path = 'C:\Users\Administrator\Desktop\Forensics Question 1.txt'
    value = 'ANSWER:\s*80'

# PLANT: Create "Forensics Question 2.txt" on Administrator's Desktop:
#   One user account on this machine does not belong to any authorized
#   user in the README. What is its username?  ANSWER:
[[check]]
message = 'Forensics Question 2 correct'
points = 7
    [[check.pass]]
    type = 'FileContainsRegex'
    path = 'C:\Users\Administrator\Desktop\Forensics Question 2.txt'
    value = 'ANSWER:\s*[Bb]ackdoor'

# ------------------------------------------------------- account management
# PLANT: net user backdoor P@ssw0rd /add
[[check]]
message = 'Removed unauthorized user backdoor'
points = 5
    [[check.pass]]
    type = 'UserExistsNot'
    user = 'backdoor'

# PLANT: create authorized standard user jdoe, then:
#   net localgroup Administrators jdoe /add
# (List jdoe as a standard user, NOT an admin, in the README.)
[[check]]
message = 'User jdoe is no longer an administrator'
points = 5
    [[check.pass]]
    type = 'UserInGroupNot'
    user = 'jdoe'
    group = 'Administrators'

# PLANT: activate the built-in Guest account: net user Guest /active:yes
[[check]]
message = 'Guest account disabled'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'EnableGuestAccount'
    value = '0'

# PLANT: create authorized user mkealoha, then check the
# "Password never expires" box in lusrmgr.msc.
[[check]]
message = 'mkealoha password set to expire'
points = 3
    [[check.pass]]
    type = 'UserDetail'
    user = 'mkealoha'
    key = 'PasswordNeverExpires'
    value = 'No'

# ---------------------------------------------------------- local policies
# Image ships with insecure defaults; no planting needed.
[[check]]
message = 'Minimum password length is 10 or more'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'MinimumPasswordLength'
    value = '10-128'

[[check]]
message = 'Password complexity enabled'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'PasswordComplexity'
    value = '1'

[[check]]
message = 'Account lockout threshold set'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'LockoutBadCount'
    value = '1-10'

[[check]]
message = 'Logon events audited (success and failure)'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'AuditLogonEvents'
    value = '3'

[[check]]
message = 'Rename Administrator account policy enabled'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'NewAdministratorName'
    value = '"CyberAdmin"'

# --------------------------------------------------------- system hardening
[[check]]
message = 'Windows Firewall enabled on all profiles'
points = 5
    [[check.pass]]
    type = 'FirewallUp'

# PLANT: Enable Remote Desktop. README says RDP is NOT required.
[[check]]
message = 'Remote Desktop disabled'
points = 4
    [[check.pass]]
    type = 'RegistryKey'
    key = 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\fDenyTSConnections'
    value = '1'

# PLANT: set RemoteRegistry to Automatic and start it.
[[check]]
message = 'Remote Registry service stopped and disabled'
points = 4
    [[check.pass]]
    type = 'ServiceStartup'
    name = 'RemoteRegistry'
    value = 'disabled'
    [[check.pass]]
    type = 'ServiceUpNot'
    name = 'RemoteRegistry'

# PLANT: Install-WindowsFeature Web-Server (IIS). README says IIS is NOT required.
# This is the Forensics Question 1 evidence (port 80).
[[check]]
message = 'Unauthorized IIS web server removed'
points = 6
    [[check.pass]]
    type = 'WindowsFeatureNot'
    name = 'Web-Server'

# PLANT: set HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA to 0
[[check]]
message = 'UAC enabled'
points = 4
    [[check.pass]]
    type = 'RegistryKey'
    key = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA'
    value = '1'

# PLANT: Enable SMBv1: Install-WindowsFeature FS-SMB1
[[check]]
message = 'SMBv1 disabled'
points = 5
    [[check.pass]]
    type = 'WindowsFeatureNot'
    name = 'FS-SMB1'

# ------------------------------------------------- prohibited files / tools
# PLANT: net share Secrets=C:\Secrets /grant:everyone,FULL (create C:\Secrets first)
[[check]]
message = 'Unauthorized share Secrets removed'
points = 4
    [[check.pass]]
    type = 'ShareExistsNot'
    name = 'Secrets'

# PLANT: install Wireshark (README does not authorize network sniffers).
[[check]]
message = 'Prohibited software Wireshark removed'
points = 4
    [[check.pass]]
    type = 'ProgramInstalledNot'
    name = 'Wireshark'

# PLANT: put an mp3 in Administrator's Music folder. README prohibits media files.
[[check]]
message = 'Non-work media file removed'
points = 3
    [[check.pass]]
    type = 'PathExistsNot'
    path = 'C:\Users\Administrator\Music\lahaina_remix.mp3'

# ------------------------------------------------------------------ penalties
# mkealoha is an authorized user (listed in README). Deleting them loses points.
[[check]]
message = 'Removed authorized user mkealoha'
points = -5
    [[check.pass]]
    type = 'UserExistsNot'
    user = 'mkealoha'

# DNS is a required service. Stopping it loses points.
[[check]]
message = 'Critical service DNS stopped'
points = -5
    [[check.pass]]
    type = 'ServiceUpNot'
    name = 'DNS'
