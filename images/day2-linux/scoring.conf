# =============================================================================
# HBA CyberEagles Bootcamp - Day 2 - Linux Server (Ubuntu 22.04)
# aeacus v2.1.1 scoring config. This file (answer key) is mirrored in the
# public fork at timames/aeacus under images/ — a deliberate choice.
#
# Lines marked PLANT: are the vulns you must create on the image before
# running `./aeacus --verbose release`. Fix-test on a clone to 100 first.
#
# README should say: SSH is a required service; FTP is NOT required;
# no media files, hacking tools, or password crackers are authorized.
#
# Total: 100 pts across 22 checks, plus 2 penalties.
# =============================================================================

name = 'hba-day2-linux'
title = 'HBA CyberEagles Bootcamp Day 2'
os = 'Ubuntu 22.04'
user = 'cpadmin'
local = true
version = '2.1.1'

# Remote scoreboard (Cloudflare Worker). Payload is plain hex (no encryption);
# vuln details are still encrypted by aeacus, server only records the score.
# Teams must set their ID in /opt/aeacus/TeamID.txt (e.g. eagles01).
remote = 'https://hba-scoreboard.tim-ames.workers.dev'
DisableRemoteEncryption = true

# ------------------------------------------------------------------ forensics
# PLANT: Create "Forensics Question 1.txt" on cpadmin's Desktop:
#   A backdoor listener was installed on this machine. What TCP port
#   does it listen on?  ANSWER:
# (Answer matches the netcat cron job planted below, port 4444.)
[[check]]
message = 'Forensics Question 1 correct'
points = 8
    [[check.pass]]
    type = 'FileContainsRegex'
    path = '/home/cpadmin/Desktop/Forensics Question 1.txt'
    value = 'ANSWER:\s*4444'

# PLANT: Create "Forensics Question 2.txt" on cpadmin's Desktop:
#   One user account on this machine does not belong to any authorized
#   user in the README. What is its username?  ANSWER:
[[check]]
message = 'Forensics Question 2 correct'
points = 8
    [[check.pass]]
    type = 'FileContainsRegex'
    path = '/home/cpadmin/Desktop/Forensics Question 2.txt'
    value = 'ANSWER:\s*[Hh]acker'

# ------------------------------------------------------- account management
# PLANT: useradd -m hacker && echo 'hacker:P@ssw0rd' | chpasswd
[[check]]
message = 'Removed unauthorized user hacker'
points = 6
    [[check.pass]]
    type = 'UserExistsNot'
    user = 'hacker'

# PLANT: create a second UID-0 account:
#   useradd -o -u 0 -g 0 -M -s /bin/bash toor && echo 'toor:toor' | chpasswd
[[check]]
message = 'Hidden root-level account toor removed'
points = 5
    [[check.pass]]
    type = 'FileContainsRegexNot'
    path = '/etc/passwd'
    value = '^toor:.*:0:0:'

# PLANT: create authorized standard user jdoe, then: usermod -aG sudo jdoe
# (List jdoe as a standard user, NOT an admin, in the README.)
[[check]]
message = 'User jdoe is no longer an administrator'
points = 5
    [[check.pass]]
    type = 'UserInGroupNot'
    user = 'jdoe'
    group = 'sudo'

# PLANT: echo 'jdoe ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/91-jdoe
[[check]]
message = 'Passwordless sudo removed from sudoers.d'
points = 4
    [[check.pass]]
    type = 'DirContainsNot'
    path = '/etc/sudoers.d/'
    value = 'NOPASSWD'

# PLANT: create authorized user bkahale with password "password".
# List that weak password in the README admin list so students audit it.
# FILL IN: run `sudo grep '^bkahale:' /etc/shadow` on the finished image and
# paste the full hash (the $6$... field) below before release.
[[check]]
message = 'bkahale weak password changed'
points = 4
    [[check.pass]]
    type = 'PasswordChanged'
    user = 'bkahale'
    value = 'REPLACE-WITH-SHADOW-HASH-e.g. $6$salt$hash'

# ---------------------------------------------------------- local policies
# Image ships with insecure defaults; no planting needed beyond confirming
# current values differ from the scored ones.
[[check]]
message = 'Maximum password age set to 90 days or less'
points = 4
    [[check.pass]]
    type = 'FileContainsRegex'
    path = '/etc/login.defs'
    value = '^PASS_MAX_DAYS\s+([1-8][0-9]|90)\s*$'

[[check]]
message = 'Password quality library installed'
points = 3
    [[check.pass]]
    type = 'ProgramInstalled'
    name = 'libpam-pwquality'

[[check]]
message = 'Minimum password length is 10 or more'
points = 4
    [[check.pass]]
    type = 'FileContainsRegex'
    path = '/etc/security/pwquality.conf'
    value = '^\s*minlen\s*=\s*(1[0-9]|[2-9][0-9])'

# --------------------------------------------------------- system hardening
# ufw ships installed but inactive on Ubuntu; no planting needed.
[[check]]
message = 'Uncomplicated Firewall (ufw) enabled'
points = 6
    [[check.pass]]
    type = 'FirewallUp'

# PLANT: in /etc/ssh/sshd_config set: PermitRootLogin yes
[[check]]
message = 'SSH root login disabled'
points = 4
    [[check.pass]]
    type = 'FileContainsRegex'
    path = '/etc/ssh/sshd_config'
    value = '^\s*PermitRootLogin\s+no'

# PLANT: in /etc/ssh/sshd_config set: PermitEmptyPasswords yes
[[check]]
message = 'SSH empty passwords disabled'
points = 3
    [[check.pass]]
    type = 'FileContainsRegex'
    path = '/etc/ssh/sshd_config'
    value = '^\s*PermitEmptyPasswords\s+no'

# PLANT: mkdir -p /root/.ssh and drop a throwaway public key into
# /root/.ssh/authorized_keys (generate one just for the image).
[[check]]
message = 'Unauthorized SSH key removed from root account'
points = 4
    [[check.pass]]
    type = 'PathExistsNot'
    path = '/root/.ssh/authorized_keys'

# PLANT: chmod 666 /etc/shadow
[[check]]
message = '/etc/shadow no longer world-readable'
points = 4
    [[check.pass]]
    type = 'PermissionIsNot'
    path = '/etc/shadow'
    value = '??????r??'

# PLANT: apt install vsftpd (README says FTP is NOT required).
[[check]]
message = 'Unnecessary FTP server vsftpd removed'
points = 4
    [[check.pass]]
    type = 'ProgramInstalledNot'
    name = 'vsftpd'

# Ubuntu ships without unattended-upgrades configured for daily checks on
# some spins; verify APT::Periodic::Update-Package-Lists is 0 before release.
[[check]]
message = 'System checks for updates automatically'
points = 3
    [[check.pass]]
    type = 'AutoCheckUpdatesEnabled'

# ------------------------------------------------- prohibited files / tools
# PLANT: copy /usr/bin/nc to /var/tmp/.cache-nc and create /etc/cron.d/updater:
#   * * * * * root /var/tmp/.cache-nc -l -p 4444 -e /bin/bash
# (This is the Forensics Question 1 evidence.)
[[check]]
message = 'Backdoor binary removed from /var/tmp'
points = 5
    [[check.pass]]
    type = 'PathExistsNot'
    path = '/var/tmp/.cache-nc'

[[check]]
message = 'Malicious cron job updater removed'
points = 5
    [[check.pass]]
    type = 'PathExistsNot'
    path = '/etc/cron.d/updater'

# PLANT: apt install john (README does not authorize password crackers).
[[check]]
message = 'Prohibited password cracker john removed'
points = 4
    [[check.pass]]
    type = 'ProgramInstalledNot'
    name = 'john'

# PLANT: apt install nmap (README does not authorize network scanners).
[[check]]
message = 'Prohibited network scanner nmap removed'
points = 4
    [[check.pass]]
    type = 'ProgramInstalledNot'
    name = 'nmap'

# PLANT: put an mp3 in cpadmin's Music folder. README prohibits media files.
[[check]]
message = 'Non-work media file removed'
points = 3
    [[check.pass]]
    type = 'PathExistsNot'
    path = '/home/cpadmin/Music/lahaina_remix.mp3'

# ------------------------------------------------------------------ penalties
# mkealoha is an authorized user (listed in README). Deleting them loses points.
# PLANT: useradd -m mkealoha (and list them in the README).
[[check]]
message = 'Removed authorized user mkealoha'
points = -5
    [[check.pass]]
    type = 'UserExistsNot'
    user = 'mkealoha'

# README says SSH is a required service. Stopping it loses points.
[[check]]
message = 'Critical service sshd stopped'
points = -5
    [[check.pass]]
    type = 'ServiceUpNot'
    name = 'ssh'

