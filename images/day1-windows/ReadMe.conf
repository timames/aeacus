<h2>Scenario</h2>
<p>
You are the new IT administrator for <b>Kaimana Engineering</b>, a small design firm in
Honolulu. The previous admin left in a hurry and nobody is quite sure what they did to this
workstation. Management suspects someone has had unauthorized access to it.
</p>
<p>
Your job is to secure this Windows 11 workstation according to company policy, without
breaking anything the staff needs to do their jobs. Read this entire document before making
changes. Answer the Forensics Questions on the Desktop <b>before</b> you start removing things,
or you may delete the evidence you need.
</p>

<h2>Team Setup</h2>
<p>
Before you begin, open <code>C:\aeacus\TeamID.txt</code> and replace its contents with your
assigned Team ID (for example <code>eagles01</code>). Save the file. If this is wrong, your
score will not appear on the scoreboard.
</p>

<h2>Forensics Questions</h2>
<p>
Forensics Questions are text files on the Desktop. Put your answer after <code>ANSWER:</code>
on the same line, then save the file. Do not change anything else in the file.
</p>

<h2>Authorized Administrators and Users</h2>
<pre>
<b>Authorized Administrators:</b>
cpadmin (you)
	password: CHANGE-ME-TO-IMAGE-PASSWORD
bkahale
	password: password

<b>Authorized Users:</b>
jdoe
mkealoha
</pre>
<p>
Any user account not listed above is not authorized. Do not remove authorized users.
Authorized users should have only the privileges listed above.
</p>

<h2>Critical Services</h2>
<ul>
  <li>None. This is a standalone workstation.</li>
</ul>

<h2>Company Policy</h2>
<ul>
  <li>This workstation is not a server. Staff do not connect to it remotely, and Remote Desktop
      is <b>not</b> required.</li>
  <li>File sharing from this workstation is not authorized.</li>
  <li>Only software needed for engineering work is permitted. Hacking tools, remote access tools,
      and network sniffers or packet capture software are <b>prohibited</b>.</li>
  <li>Non-work media files (music, videos, etc.) are not permitted on company machines.</li>
  <li>All accounts must use strong passwords. Passwords must expire periodically and must not
      be reused.</li>
  <li>Microsoft Defender Antivirus is the company's approved antivirus and must remain running.</li>
  <li>Windows Firewall must be enabled.</li>
</ul>

<h2>Competition Guidelines</h2>
<ul>
  <li>Your score updates automatically every few minutes. Check the scoring report on the
      Desktop to see your progress.</li>
  <li>You can lose points for harmful changes, such as removing authorized users or disabling
      required security software.</li>
  <li>Do not attempt to tamper with the scoring engine or anything in <code>C:\aeacus</code>
      other than <code>TeamID.txt</code>.</li>
  <li>Take notes. You'll want them on Day 2.</li>
</ul>
