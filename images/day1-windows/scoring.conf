# =============================================================================
# HBA CyberEagles Bootcamp - Day 1 - Windows Workstation (Win 10/11)
# aeacus v2.1.1 scoring config. This file (answer key) is mirrored in the
# public fork at timames/aeacus under images/ — a deliberate choice.
#
# Lines marked PLANT: are the vulns you must create on the image before
# running `aeacus --verbose release`. Fix-test on a clone to 100 first.
#
# Total: 100 pts across 20 checks, plus 2 penalties.
# =============================================================================

name = 'hba-day1-windows'
title = 'HBA CyberEagles Bootcamp Day 1'
os = 'Windows 11'
user = 'cpadmin'
local = true
version = '2.1.1'

# Remote scoreboard (Cloudflare Worker). Payload is plain hex (no encryption);
# vuln details are still encrypted by aeacus, server only records the score.
# Teams must set their ID in C:\aeacus\TeamID.txt (e.g. eagles01).
remote = 'https://hba-scoreboard.tim-ames.workers.dev'
DisableRemoteEncryption = true

# ------------------------------------------------------------------ forensics
# PLANT: Create "Forensics Question 1.txt" on cpadmin's Desktop:
#   A backdoor listener was installed on this machine. What TCP port
#   does it listen on?  ANSWER:
# (Answer matches the nc.exe scheduled task planted below, port 4444.)
[[check]]
message = 'Forensics Question 1 correct'
points = 8
    [[check.pass]]
    type = 'FileContains'
    path = 'C:\Users\cpadmin\Desktop\Forensics Question 1.txt'
    value = 'ANSWER:\s*4444'
    regex = true

# PLANT: Create "Forensics Question 2.txt" on cpadmin's Desktop:
#   One user account on this machine does not belong to any authorized
#   user in the README. What is its username?  ANSWER:
[[check]]
message = 'Forensics Question 2 correct'
points = 7
    [[check.pass]]
    type = 'FileContains'
    path = 'C:\Users\cpadmin\Desktop\Forensics Question 2.txt'
    value = 'ANSWER:\s*[Hh]acker'
    regex = true

# ------------------------------------------------------- account management
# PLANT: net user hacker P@ssw0rd /add
[[check]]
message = 'Removed unauthorized user hacker'
points = 5
    [[check.pass]]
    type = 'UserExistsNot'
    user = 'hacker'

# PLANT: create authorized standard user jdoe, then:
#   net localgroup Administrators jdoe /add
# (List jdoe as a standard user, NOT an admin, in the README.)
[[check]]
message = 'User jdoe is no longer an administrator'
points = 5
    [[check.pass]]
    type = 'UserInGroupNot'
    user = 'jdoe'
    group = 'Administrators'

# PLANT: activate the built-in Guest account: net user Guest /active:yes
[[check]]
message = 'Guest account disabled'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'EnableGuestAccount'
    value = '0'

# PLANT: create authorized user mkealoha, then check the
# "Password never expires" box in lusrmgr.msc.
[[check]]
message = 'mkealoha password set to expire'
points = 3
    [[check.pass]]
    type = 'UserDetail'
    user = 'mkealoha'
    key = 'PasswordNeverExpires'
    value = 'No'

# PLANT: create authorized user bkahale with password "password".
# List that weak password in the README admin list so students audit it.
# FILL IN: run (Get-LocalUser bkahale).PasswordLastSet on the finished image
# and paste the value below before release.
[[check]]
message = 'bkahale weak password changed'
points = 4
    [[check.pass]]
    type = 'PasswordChanged'
    user = 'bkahale'
    after = 'REPLACE-WITH-PasswordLastSet-e.g. Monday, January 02, 2006 3:04:05 PM'

# ---------------------------------------------------------- local policies
# Image ships with all of these at insecure defaults; no planting needed
# beyond confirming current values differ from the scored range.
[[check]]
message = 'Minimum password length is 10 or more'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'MinimumPasswordLength'
    value = '10-128'

[[check]]
message = 'Password complexity enabled'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'PasswordComplexity'
    value = '1'

[[check]]
message = 'Maximum password age between 30 and 90 days'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'MaximumPasswordAge'
    value = '30-90'

[[check]]
message = 'Password history of at least 5 remembered'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'PasswordHistorySize'
    value = '5-24'

[[check]]
message = 'Account lockout threshold set'
points = 4
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'LockoutBadCount'
    value = '1-10'

[[check]]
message = 'Logon events audited (success and failure)'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'AuditLogonEvents'
    value = '3'

[[check]]
message = 'Last signed-in user not displayed at logon'
points = 3
    [[check.pass]]
    type = 'SecurityPolicy'
    key = 'DontDisplayLastUserName'
    value = '1'

# --------------------------------------------------------- system hardening
[[check]]
message = 'Windows Firewall enabled on all profiles'
points = 5
    [[check.pass]]
    type = 'FirewallUp'

# PLANT: Enable Remote Desktop in Settings. README says RDP is NOT required.
[[check]]
message = 'Remote Desktop disabled'
points = 4
    [[check.pass]]
    type = 'RegistryKey'
    key = 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\fDenyTSConnections'
    value = '1'

# PLANT: set RemoteRegistry to Automatic and start it.
[[check]]
message = 'Remote Registry service stopped and disabled'
points = 4
    [[check.pass]]
    type = 'ServiceStartup'
    name = 'RemoteRegistry'
    value = 'disabled'
    [[check.pass]]
    type = 'ServiceUpNot'
    name = 'RemoteRegistry'

# PLANT: Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol
[[check]]
message = 'SMBv1 disabled'
points = 5
    [[check.pass]]
    type = 'WindowsFeatureNot'
    name = 'SMB1Protocol'

# PLANT: set HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA to 0 (UAC off)
[[check]]
message = 'UAC enabled'
points = 4
    [[check.pass]]
    type = 'RegistryKey'
    key = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA'
    value = '1'

# PLANT: net share Secrets=C:\Secrets /grant:everyone,FULL (create C:\Secrets first)
[[check]]
message = 'Unauthorized share Secrets removed'
points = 4
    [[check.pass]]
    type = 'ShareExistsNot'
    name = 'Secrets'

# ------------------------------------------------- prohibited files / tools
# PLANT: copy ncat.exe (from the nmap distribution) to C:\Windows\Temp\ncat.exe
# and create a scheduled task named "Updater" that runs it as a listener on
# TCP 4444 at logon (this is the Forensics Question 1 evidence).
[[check]]
message = 'Backdoor binary removed from Windows Temp'
points = 5
    [[check.pass]]
    type = 'PathExistsNot'
    path = 'C:\Windows\Temp\ncat.exe'

[[check]]
message = 'Malicious scheduled task Updater removed'
points = 4
    [[check.pass]]
    type = 'ScheduledTaskExistsNot'
    name = 'Updater'

# PLANT: install Wireshark (README does not authorize network sniffers).
[[check]]
message = 'Prohibited software Wireshark removed'
points = 4
    [[check.pass]]
    type = 'ProgramInstalledNot'
    name = 'Wireshark'

# PLANT: put an mp3 in cpadmin's Music folder. README prohibits media files.
[[check]]
message = 'Non-work media file removed'
points = 3
    [[check.pass]]
    type = 'PathExistsNot'
    path = 'C:\Users\cpadmin\Music\lahaina_remix.mp3'

# ------------------------------------------------------------------ penalties
# mkealoha is an authorized user (listed in README). Deleting them loses points.
[[check]]
message = 'Removed authorized user mkealoha'
points = -5
    [[check.pass]]
    type = 'UserExistsNot'
    user = 'mkealoha'

# Students must not "harden" Defender into oblivion.
[[check]]
message = 'Microsoft Defender service stopped'
points = -5
    [[check.pass]]
    type = 'ServiceUpNot'
    name = 'WinDefend'